{% comment %}
Stylised sports-coupe silhouette. Params:
  paint  - body colour (hex/hsl)          spin - true to spin wheels continuously
  beam   - true to show headlight beam    stripe - true for racing stripe
{% endcomment %}
<svg class="car-svg{% if spin %} spin{% endif %}" viewBox="0 0 640 215" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="cc-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset=".35" stop-color="#fff" stop-opacity=".08"/>
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="cc-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fb4c8" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#1a222c" stop-opacity=".95"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="cc-stripe" x1="0" x2="1">
      <stop offset="0" stop-color="#ffb21a"/><stop offset=".6" stop-color="#ff6b1a"/><stop offset="1" stop-color="#ff3d2e"/>
    </linearGradient>
    <linearGradient id="cc-beam" x1="0" x2="1">
      <stop offset="0" stop-color="#fff3c4" stop-opacity=".55"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cc-rim" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e5e8ec"/><stop offset=".7" stop-color="#7d848e"/><stop offset="1" stop-color="#3a3f46"/>
    </radialGradient>
    <radialGradient id="cc-shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000" stop-opacity=".75"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  {% if beam %}<polygon class="beam" points="618,116 900,70 900,190 618,132" fill="url(#cc-beam)"/>{% endif %}
  <ellipse cx="322" cy="200" rx="300" ry="13" fill="url(#cc-shadow)"/>

  <!-- body -->
  <path d="M22,152 L22,128 C22,116 30,108 48,104 L124,95 C166,88 196,60 252,49 C292,41 352,40 392,46 C432,52 468,74 500,88 L588,103 C610,107 622,120 624,134 L624,150 C624,156 620,160 612,160 L548,160 A48,48 0 0 0 452,160 L210,160 A48,48 0 0 0 114,160 L36,160 C28,160 22,158 22,152 Z"
        fill="{{ paint|default:'#2a3038' }}"/>
  <path d="M22,152 L22,128 C22,116 30,108 48,104 L124,95 C166,88 196,60 252,49 C292,41 352,40 392,46 C432,52 468,74 500,88 L588,103 C610,107 622,120 624,134 L624,150 C624,156 620,160 612,160 L548,160 A48,48 0 0 0 452,160 L210,160 A48,48 0 0 0 114,160 L36,160 C28,160 22,158 22,152 Z"
        fill="url(#cc-gloss)" stroke="rgba(255,255,255,.22)" stroke-width="1.2"/>

  <!-- glasshouse -->
  <path d="M148,97 C186,89 212,66 260,57 C297,50 350,49 386,55 C416,60 444,76 470,92 Z" fill="url(#cc-glass)" stroke="rgba(255,255,255,.15)"/>
  <path d="M332,51 L330,95" stroke="{{ paint|default:'#2a3038' }}" stroke-width="7"/>
  <path d="M190,80 C230,62 300,56 360,58" stroke="rgba(255,255,255,.25)" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- details -->
  {% if stripe %}<path d="M40,130 L604,122" stroke="url(#cc-stripe)" stroke-width="4" stroke-linecap="round"/>{% endif %}
  <path d="M300,108 L318,108" stroke="rgba(255,255,255,.35)" stroke-width="3" stroke-linecap="round"/>
  <path d="M210,98 C215,125 214,140 210,158 M452,104 C447,125 448,140 452,158" stroke="rgba(0,0,0,.35)" stroke-width="1.5" fill="none"/>
  <path d="M596,112 C606,113 614,117 618,123 L600,124 Z" fill="#fff6d6"/>
  <ellipse cx="606" cy="118" rx="14" ry="5" fill="#ffd36b" opacity=".55"/>
  <path d="M24,116 L40,112 L40,124 L24,126 Z" fill="#ff2a2a"/>
  <ellipse cx="30" cy="119" rx="10" ry="5" fill="#ff2a2a" opacity=".45"/>
  <path d="M560,150 L620,148" stroke="rgba(0,0,0,.5)" stroke-width="4" stroke-linecap="round"/>

  <!-- wheels -->
  <g transform="translate(162 160)">
    <g class="wheel">
      <circle r="41" fill="#0b0c0e" stroke="#25282d" stroke-width="5"/>
      <circle r="27" fill="url(#cc-rim)"/>
      <g stroke="#2a2e34" stroke-width="5" stroke-linecap="round">
        <line x1="0" y1="-25" x2="0" y2="-7"/><line x1="23.8" y1="-7.7" x2="6.7" y2="-2.2"/><line x1="14.7" y1="20.2" x2="4.1" y2="5.7"/><line x1="-14.7" y1="20.2" x2="-4.1" y2="5.7"/><line x1="-23.8" y1="-7.7" x2="-6.7" y2="-2.2"/>
      </g>
      <circle r="6" fill="#16181b" stroke="#ff6b1a" stroke-width="2"/>
    </g>
  </g>
  <g transform="translate(500 160)">
    <g class="wheel">
      <circle r="41" fill="#0b0c0e" stroke="#25282d" stroke-width="5"/>
      <circle r="27" fill="url(#cc-rim)"/>
      <g stroke="#2a2e34" stroke-width="5" stroke-linecap="round">
        <line x1="0" y1="-25" x2="0" y2="-7"/><line x1="23.8" y1="-7.7" x2="6.7" y2="-2.2"/><line x1="14.7" y1="20.2" x2="4.1" y2="5.7"/><line x1="-14.7" y1="20.2" x2="-4.1" y2="5.7"/><line x1="-23.8" y1="-7.7" x2="-6.7" y2="-2.2"/>
      </g>
      <circle r="6" fill="#16181b" stroke="#ff6b1a" stroke-width="2"/>
    </g>
  </g>
</svg>
